<div class="sign-in-shell">
  <div class="sign-in-card">
    <img class="sign-in-logo brand-mark--light" src="assets/brand/products/svg/light/08-pulse.svg" alt="Pulse" /><img class="sign-in-logo brand-mark--dark" src="assets/brand/products/svg/dark/08-pulse.svg" alt="" />
    <h1 class="mb-1">Sign in</h1>
    <p class="text-muted mb-4">Sign in with your 16Ahead account to continue.</p>
    <button type="button" class="btn btn-dark w-100" [disabled]="isSigningIn" (click)="signIn()">
      {{ isSigningIn ? 'Redirecting...' : 'Sign in with 16Ahead' }}
    </button>
  </div>
</div>
